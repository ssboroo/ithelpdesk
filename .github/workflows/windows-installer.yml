name: Native Windows remote desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cancel-obsolete:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow windows-installer.yml --branch "$GITHUB_REF_NAME" --status in_progress --json databaseId --jq '.[].databaseId' | while read -r run_id; do
            if (( run_id < GITHUB_RUN_ID )); then gh run cancel "$run_id" || true; fi
          done
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets==15.0.1
      - run: python tests-native/relay_test.py
  build:
    needs: relay
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build native client, test live encrypted screen roundtrip, package
        shell: pwsh
        run: ./build-windows.ps1 -Version "3.0.${{ github.run_number }}"
      - name: Verify native install, UI startup, uninstall and portable startup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'RainyNativeSmoke'
          $setup=Get-ChildItem release/RainyRemote-Setup-*.exe | Select-Object -First 1
          $install=Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installation failed' }
          $app=Start-Process "$target/RainyRemote.exe" -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw 'Installed application exited' }
          Stop-Process -Id $app.Id
          $remove=Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw 'Uninstall failed' }
          $portable=Start-Process 'release/RainyRemote-Portable.exe' -PassThru
          Start-Sleep -Seconds 8
          $portable.Refresh()
          if ($portable.HasExited) { throw 'Portable application exited' }
          $duplicate=Start-Process 'release/RainyRemote-Portable.exe' -PassThru
          if (!$duplicate.WaitForExit(15000)) { Stop-Process -Id $duplicate.Id; throw 'Duplicate application window remained open' }
          if ($duplicate.ExitCode -ne 0) { throw 'Single instance activation failed' }
          $portable.Refresh()
          if ($portable.HasExited) { throw 'Original window closed during duplicate activation' }
          Stop-Process -Id $portable.Id
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-test-results
          path: |
            self-test-result.json
            ui-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RainyRemote-Windows
          path: release/*
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RainyRemote-Windows
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "v3.0.${{ github.run_number }}" release/*
          --target "${{ github.sha }}" --title "RAINY Remote Native 3.0.${{ github.run_number }}"
          --notes "Өөрийн Windows native клиент, relay, дэлгэц, гар/хулгана. RustDesk / AnyDesk / Python шаардлагагүй. Зөвшөөрөл ба хос код баталгаажуулалттай. Нэг цонхны урсгал, frame ACK backpressure, background decode, adaptive 1080p хүртэл, 20fps хүртэл; файл, дуу, clipboard, UAC control хараахан ороогүй. CI live relay roundtrip болон Windows capture/render шалгасан."
